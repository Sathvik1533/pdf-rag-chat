services:
  - type: web
    name: pdf-rag-chat
    env: python
    buildCommand: "export HF_HOME=$(pwd)/.cache/huggingface && pip install --upgrade pip && pip install -r requirements.txt && python -c 'import os; from app.config import CACHE_DIR; from sentence_transformers import SentenceTransformer; SentenceTransformer(\"all-MiniLM-L6-v2\", device=\"cpu\", cache_folder=str(CACHE_DIR))'"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1 --limit-concurrency 10"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.15
      - key: HF_HOME
        value: /opt/render/project/src/.cache/huggingface
      - key: TRANSFORMERS_CACHE
        value: /opt/render/project/src/.cache/huggingface
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "llama-3.3-70b-versatile"
      - key: GROUNDING_THRESHOLD
        value: "0.35"
      - key: TOP_K
        value: "4"
      - key: CHUNK_SIZE
        value: "500"
      - key: CHUNK_OVERLAP
        value: "50"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: VECLIB_MAXIMUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
